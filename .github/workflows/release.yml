name: 发版

# 推注解 tag 即发版：构建全部变体，把产物附到同名 GitHub Release 上。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出（取全量历史，判断 tag 指向需要祖先关系）
        uses: actions/checkout@v4
          fetch-depth: 0

      - name: 校验注解 tag 与指向
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OBJ_TYPE=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME" --jq '.object.type')
          if [ "$OBJ_TYPE" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME 是轻量 tag（object.type=$OBJ_TYPE），发版要求注解 tag"
            exit 1
          fi
          echo "注解 tag 校验通过：$GITHUB_REF_NAME"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME 指向的提交不在 main 上"
            exit 1
          fi
          echo "tag 指向的提交在 main 上"

      - name: 校验版本号与构建脚本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILD_VERSION=$(grep -oP '^mod_version=\K.*' gradle.properties | head -1)
          if [ "$TAG_VERSION" != "$BUILD_VERSION" ]; then
            echo "::error::tag 版本 $TAG_VERSION 与 gradle.properties 的 mod_version $BUILD_VERSION 不一致"
            exit 1
          fi
          echo "版本一致：$TAG_VERSION"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
          distribution: temurin
          java-version: '21'

      - name: 准备 Gradle（含构建缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 构建全部变体
        # chiseledBuild 会为每个变体生成源码再构建；单独构建某个变体会因缺源码而产出空 jar
        run: ./gradlew chiseledBuild --no-daemon

      - name: 汇总产物并唯一化命名
        run: |
          mkdir -p dist
          for dir in versions/*/; do
            variant=$(basename "$dir")
            jar=$(find "$dir/build/libs" -maxdepth 1 -name 'mirrordim-*.jar' \
                  ! -name '*-slim*' ! -name '*-dev*' 2>/dev/null | head -1)
            if [ -z "$jar" ]; then
              echo "::error::$variant 没有产物"
              exit 1
            fi
            cp "$jar" "dist/mirrordim-${variant}-${TAG_VERSION}.jar"
          done
          echo "共 $(ls dist | wc -l) 个产物："
          ls -la dist

      - name: 创建 Release 并附上产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.jar
