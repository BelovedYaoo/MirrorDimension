modLoader = "javafml"
loaderVersion = "${loader_language_version}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "${mod_author}"
    description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "${loader_mod_id}"
    type = "required"
    versionRange = "${loader_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "create"
    type = "optional"
    versionRange = "[0.5.1,)"
    ordering = "AFTER"
    side = "BOTH"
